{{<error}}
    {{$header}}
        {{#t}}errors.cookies-required.title{{/t}}
    {{/header}}
    {{$content}}
        <h1 class="govuk-heading-l">{{#t}}errors.cookies-required.title{{/t}}</h1>
        <p>{{{content.message}}}</p>
        <a href="" class="govuk-button">{{#t}}buttons.try-again{{/t}}</a>
        {{#showStack}}
            <pre>{{error.stack}}</pre>
        {{/showStack}}
    {{/content}}
{{/error}}
