version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    versioning-strategy: increase
    schedule:
      interval: daily
      time: "06:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
    pull-request-branch-name:
      template: "{prefix}/{name}"
      separator: "-"
      word-separator: "-"
      branch-name-case: "lowercase"
      max-length: 60
    groups:
      hof-dependency:
        applies-to: version-updates
        patterns:
          - "hof"
      patch-and-minor:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "hof"
        update-types:
          - patch
          - minor
