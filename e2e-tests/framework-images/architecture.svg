<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="610" viewBox="0 0 1400 610" role="img" aria-labelledby="title description">
  <title id="title">LMR E2E framework architecture</title>
  <desc id="description">Gherkin features are converted by bddgen into generated Playwright tests. Steps receive a typed pages fixture, invoke page objects and assert outcomes. Shared base helpers and test data support execution. Playwright produces reports and Drone publishes the PR report.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker></defs>
  <rect width="1400" height="610" fill="#f1f5f9"/>
  <text x="40" y="52" font-family="Arial,sans-serif" font-size="30" font-weight="bold" fill="#0f172a">LMR: business scenario to browser and report</text>
  <g font-family="Arial,sans-serif" font-size="19" text-anchor="middle" fill="#0f172a">
    <rect x="40" y="110" width="200" height="85" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="140" y="145">Gherkin features</text><text x="140" y="173" font-size="16">business intent and data</text>
    <rect x="310" y="110" width="220" height="85" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="420" y="145">bddgen</text><text x="420" y="173" font-size="16">.features-gen tests</text>
    <rect x="600" y="110" width="220" height="85" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="710" y="145">Playwright runner</text><text x="710" y="173" font-size="16">isolation, retries, evidence</text>
    <rect x="890" y="110" width="220" height="85" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="1000" y="145">Typed pages fixture</text><text x="1000" y="173" font-size="16">objects share one test page</text>
    <rect x="890" y="280" width="220" height="85" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="1000" y="315">BDD steps</text><text x="1000" y="343" font-size="16">journey and outcome</text>
    <rect x="600" y="280" width="220" height="85" rx="10" fill="#dcfce7" stroke="#15803d"/><text x="710" y="315">Page objects</text><text x="710" y="343" font-size="16">locators and page actions</text>
    <rect x="310" y="280" width="220" height="85" rx="10" fill="#fef3c7" stroke="#b45309"/><text x="420" y="315">Browser and service</text><text x="420" y="343" font-size="16">actual UI interactions</text>
    <rect x="40" y="280" width="200" height="85" rx="10" fill="#e2e8f0" stroke="#64748b"/><text x="140" y="315">Shared helpers</text><text x="140" y="343" font-size="16">base page and constants</text>
    <rect x="600" y="455" width="220" height="85" rx="10" fill="#ede9fe" stroke="#7c3aed"/><text x="710" y="490">Reports and artifacts</text><text x="710" y="518" font-size="16">HTML / nightly JSON</text>
    <rect x="890" y="455" width="220" height="85" rx="10" fill="#ede9fe" stroke="#7c3aed"/><text x="1000" y="490">Drone publishing</text><text x="1000" y="518" font-size="16">release ZIP and PR comment</text>
  </g>
  <g stroke="#334155" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M240 152 H305"/><path d="M530 152 H595"/><path d="M820 152 H885"/><path d="M1000 195 V275"/>
    <path d="M890 322 H825"/><path d="M600 322 H535"/><path d="M140 365 V404 H710 V370" stroke-dasharray="7 5"/>
    <path d="M660 195 V232 H1170 V430 H710 V450"/><path d="M820 497 H885"/>
  </g>
  <text x="40" y="580" font-family="Arial,sans-serif" font-size="16" fill="#475569">Configuration controls discovery, target URL, browser and execution. Allure is an optional adoption extension, not configured in this checkout.</text>
</svg>
