<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820" role="img" aria-labelledby="title description">
  <title id="title">Sequence of one LMR journey example</title>
  <desc id="description">bddgen expands a feature example. The runner constructs the fixture, invokes Given to navigate, then When to choose a switch case and call page objects in sequence. Page objects interact with the service. Then asserts the submitted heading, and the runner writes the report for Drone publishing.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker></defs>
  <rect width="1500" height="820" fill="#f8fafc"/>
  <text x="35" y="45" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#0f172a">One generated test: T1 or T2 report-submission journey</text>
  <g font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#0f172a">
    <g fill="#dbeafe" stroke="#2563eb"><rect x="35" y="80" width="210" height="55" rx="8"/><rect x="325" y="80" width="210" height="55" rx="8"/><rect x="615" y="80" width="210" height="55" rx="8"/><rect x="905" y="80" width="210" height="55" rx="8"/><rect x="1195" y="80" width="260" height="55" rx="8"/></g>
    <text x="140" y="115">Feature / bddgen</text><text x="430" y="115">Runner / fixture</text><text x="720" y="115">BDD steps</text><text x="1010" y="115">Page objects</text><text x="1325" y="115">Browser / service</text>
  </g>
  <g stroke="#94a3b8" stroke-dasharray="5 6" stroke-width="2">
    <path d="M140 135 V750 M430 135 V750 M720 135 V750 M1010 135 V750 M1325 135 V750"/>
  </g>
  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M140 190 H430"/><path d="M430 260 H720"/><path d="M720 325 H1010"/><path d="M1010 390 H1325"/>
    <path d="M720 475 H1010"/><path d="M1010 540 H1325"/><path d="M720 615 H1010"/><path d="M1010 680 H720"/><path d="M720 740 H430"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="17" fill="#0f172a">
    <text x="158" y="179">Expand Examples into tests</text>
    <text x="450" y="230">Construct pages on this test's page</text><text x="450" y="249">Invoke Given</text>
    <text x="740" y="313">Navigate to service root</text>
    <text x="1030" y="378">page.goto('/')</text>
    <text x="740" y="440">When: lowercase and select case</text><text x="740" y="463">Await page methods in order</text>
    <text x="1030" y="505">Scan, check title, fill, continue</text><text x="1030" y="529">Summary, declaration and submit</text>
    <text x="740" y="603">Then: get heading locator</text>
    <text x="745" y="668">Heading locator returned to step</text>
    <text x="450" y="728">Assert heading; record outcome</text>
  </g>
  <text x="35" y="790" font-family="Arial,sans-serif" font-size="17" fill="#475569">After execution: HTML/list reporters run; eligible Drone PR builds upload the HTML report ZIP and create or update a bot comment.</text>
</svg>
